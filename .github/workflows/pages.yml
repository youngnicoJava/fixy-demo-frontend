name: Validate and deploy demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx eslint src/app/demo src/app/core/services/auth.service.ts src/app/core/services/payment.service.ts
      - run: bun run test -- --watch=false
      - uses: actions/configure-pages@v5
      - run: bun run build -- --configuration production,github-pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/fixy-demo/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
