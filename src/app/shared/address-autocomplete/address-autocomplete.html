<div class="autocomplete">
  <div class="input-wrapper">
    <input
      #inputRef
      type="text"
      [ngModel]="query"
      (ngModelChange)="onQueryChange($event)"
      placeholder="Buscar direccion..."
      autocomplete="off"
    />

    <button
      type="button"
      class="map-picker-btn"
      (click)="openMapPicker()"
      title="Seleccionar ubicacion en el mapa"
      aria-label="Seleccionar ubicacion en el mapa"
    >
      <lucide-icon [img]="MapPinIcon" size="20" aria-hidden="true"></lucide-icon>
    </button>
  </div>

  @if (loading()) {
    <div class="loading-hint">
      <span class="spinner-small" aria-hidden="true"></span>
      Buscando direcciones...
    </div>
  }

  @if (results().length > 0) {
    <div class="results visible">
@for (
  result of results();
  track result.label + '|' + result.latitude + ',' + result.longitude
) {
   <button
          type="button"
          class="result"
          (click)="selectLocation(result)"
        >
          <div class="label">{{ result.label }}</div>
          <div class="address">{{ result.address }}</div>
        </button>
      }
    </div>
  }
</div>
